name: Build ZL Cut APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (ZIP اس release میں اپلوڈ ہونی چاہیے)"
        required: true
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download source ZIP from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG:-}" ]]; then
            echo "Release tag missing. Provide a tag or publish a release." >&2
            exit 1
          fi
          mkdir -p source
          gh release download "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --pattern "*.zip" \
            --dir source

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find source -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          GRADLEW="$(find extracted -type f -name gradlew -print -quit)"
          if [[ -z "$GRADLEW" ]]; then
            echo "No Gradle wrapper found in source ZIP." >&2
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          chmod +x "$GRADLEW"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('extracted/**/*.gradle*', 'extracted/**/gradle-wrapper.properties', 'extracted/**/*.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZL-Cut-debug-APK
          path: ${{ steps.project.outputs.dir }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
