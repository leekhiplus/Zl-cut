name: Build ZL Cut APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (ZIP اس release میں اپلوڈ ہونی چاہیے)"
        required: true
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform 37
        shell: bash
        run: |
          set -uo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          echo "Using: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --list 2>/dev/null | grep -E "platforms;android-3[6-9]|build-tools;3[6-9]" | head -20 || true
          # API 37 کا نام android-37.0 ہو سکتا ہے، اس لیے دونوں آزمائیں
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" \
            || yes | "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" \
            || echo "Manual SDK install failed; Gradle will try to auto-download."
          exit 0

      - name: Download source ZIP from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG:-}" ]]; then
            echo "Release tag missing. Provide a tag or publish a release." >&2
            exit 1
          fi
          mkdir -p source
          gh release download "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --pattern "*.zip" \
            --dir source

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find source -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          GRADLEW="$(find extracted -type f -name gradlew -print -quit)"
          if [[ -z "$GRADLEW" ]]; then
            echo "No Gradle wrapper found in source ZIP." >&2
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          chmod +x "$GRADLEW"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('extracted/**/*.gradle*', 'extracted/**/gradle-wrapper.properties', 'extracted/**/*.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon :app:assembleDebug "-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZL-Cut-debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
